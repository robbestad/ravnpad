name: Release

on:
  pull_request:
  workflow_dispatch:
    inputs:
      notarize:
        description: Sign and notarize the macOS artifacts
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check-linux:
    name: Linux tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --locked --bins

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
            artifact: ravnpad-windows-x86_64.zip
          - os: macos-15
            name: macos-aarch64
            artifact: ravnpad-macos-aarch64.zip
          - os: macos-15-intel
            name: macos-x86_64
            artifact: ravnpad-macos-x86_64.zip

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches crate version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$tag" != "$crate" ]; then
            echo "tag v$tag does not match Cargo.toml version $crate"
            exit 1
          fi

      - name: Test shared controller
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Test native text control
        shell: bash
        run: ./target/release/ravnpad --native-smoke-test

      - name: Import Developer ID certificate
        if: runner.os == 'macOS' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.notarize))
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/ravnpad-signing.keychain-db"
          keychain_password="$(uuidgen)"

          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | /usr/bin/base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          identity_hash="$(security find-identity -v -p codesigning "$keychain_path" | awk '/"Developer ID Application:/ { print $2; exit }')"
          if [ -z "$identity_hash" ]; then
            echo "No Developer ID Application identity was imported"
            exit 1
          fi

          echo "MACOS_SIGNING_IDENTITY=$identity_hash" >> "$GITHUB_ENV"
          echo "MACOS_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/ravnpad.exe,target/release/ravnpad-host.exe,target/release/ravnpad-cli.exe,target/release/ravnpad-mcp.exe -DestinationPath ${{ matrix.artifact }}
          $verify = Join-Path $env:RUNNER_TEMP "ravnpad-package"
          Expand-Archive -Path ${{ matrix.artifact }} -DestinationPath $verify
          @("ravnpad.exe", "ravnpad-host.exe", "ravnpad-cli.exe", "ravnpad-mcp.exe") | ForEach-Object {
            if (-not (Test-Path -LiteralPath (Join-Path $verify $_))) { throw "Missing packaged binary: $_" }
          }

      - name: Package macOS
        if: runner.os == 'macOS'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p RavnPad.app/Contents/MacOS RavnPad.app/Contents/Helpers RavnPad.app/Contents/Resources
          cp target/release/ravnpad RavnPad.app/Contents/MacOS/ravnpad
          cp target/release/ravnpad-host RavnPad.app/Contents/Helpers/ravnpad-host
          cp target/release/ravnpad-cli RavnPad.app/Contents/Helpers/ravnpad-cli
          cp target/release/ravnpad-mcp RavnPad.app/Contents/Helpers/ravnpad-mcp
          chmod +x RavnPad.app/Contents/MacOS/ravnpad RavnPad.app/Contents/Helpers/ravnpad-host RavnPad.app/Contents/Helpers/ravnpad-cli RavnPad.app/Contents/Helpers/ravnpad-mcp
          cp packaging/macos/Info.plist RavnPad.app/Contents/Info.plist
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" -c "Set :CFBundleVersion $version" RavnPad.app/Contents/Info.plist
          test -f target/release/ravnpad.icns
          cp target/release/ravnpad.icns RavnPad.app/Contents/Resources/RavnPad.icns
          # Sign nested executables before sealing the complete bundle. Pull
          # requests use an ad hoc identity; releases use Developer ID with
          # hardened runtime and a trusted timestamp.
          if [ -n "${MACOS_SIGNING_IDENTITY:-}" ]; then
            sign_args=(--force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY")
          else
            sign_args=(--force --sign -)
          fi
          codesign "${sign_args[@]}" --identifier com.ravnpress.ravnpad.host RavnPad.app/Contents/Helpers/ravnpad-host
          codesign "${sign_args[@]}" --identifier com.ravnpress.ravnpad.cli RavnPad.app/Contents/Helpers/ravnpad-cli
          codesign "${sign_args[@]}" --identifier com.ravnpress.ravnpad.mcp RavnPad.app/Contents/Helpers/ravnpad-mcp
          codesign --verify --strict --verbose=4 RavnPad.app/Contents/Helpers/ravnpad-host
          codesign --verify --strict --verbose=4 RavnPad.app/Contents/Helpers/ravnpad-cli
          codesign --verify --strict --verbose=4 RavnPad.app/Contents/Helpers/ravnpad-mcp
          codesign "${sign_args[@]}" RavnPad.app
          codesign --verify --deep --strict --verbose=4 RavnPad.app

          if [ -n "${MACOS_SIGNING_IDENTITY:-}" ]; then
            actual_team="$(codesign -dv --verbose=4 RavnPad.app 2>&1 | sed -n 's/^TeamIdentifier=//p')"
            if [ "$actual_team" != "$APPLE_TEAM_ID" ]; then
              echo "Signed bundle TeamIdentifier does not match APPLE_TEAM_ID"
              exit 1
            fi
          fi
          ditto -c -k --sequesterRsrc --keepParent RavnPad.app "${{ matrix.artifact }}"

          # Verify the actual deliverable after a ZIP round trip.
          verify_dir="$(mktemp -d)"
          ditto -x -k "${{ matrix.artifact }}" "$verify_dir"
          codesign --verify --deep --strict --verbose=4 "$verify_dir/RavnPad.app"
          test -x "$verify_dir/RavnPad.app/Contents/MacOS/ravnpad"
          test -x "$verify_dir/RavnPad.app/Contents/Helpers/ravnpad-host"
          test -x "$verify_dir/RavnPad.app/Contents/Helpers/ravnpad-cli"
          test -x "$verify_dir/RavnPad.app/Contents/Helpers/ravnpad-mcp"
          test -f "$verify_dir/RavnPad.app/Contents/Resources/RavnPad.icns"
          rm -rf "$verify_dir"

      - name: Notarize and staple macOS app
        if: runner.os == 'macOS' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.notarize))
        env:
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          api_key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY_BASE64" | /usr/bin/base64 -D > "$api_key_path"
          chmod 600 "$api_key_path"

          xcrun notarytool submit "${{ matrix.artifact }}" \
            --key "$api_key_path" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple RavnPad.app
          xcrun stapler validate RavnPad.app
          spctl --assess --type execute --verbose=4 RavnPad.app

          # Rebuild the downloadable archive so it contains the stapled ticket.
          rm -f "${{ matrix.artifact }}"
          ditto -c -k --sequesterRsrc --keepParent RavnPad.app "${{ matrix.artifact }}"
          verify_dir="$(mktemp -d)"
          ditto -x -k "${{ matrix.artifact }}" "$verify_dir"
          codesign --verify --deep --strict --verbose=4 "$verify_dir/RavnPad.app"
          xcrun stapler validate "$verify_dir/RavnPad.app"
          test -x "$verify_dir/RavnPad.app/Contents/MacOS/ravnpad"
          test -x "$verify_dir/RavnPad.app/Contents/Helpers/ravnpad-host"
          test -x "$verify_dir/RavnPad.app/Contents/Helpers/ravnpad-cli"
          test -x "$verify_dir/RavnPad.app/Contents/Helpers/ravnpad-mcp"
          rm -rf "$verify_dir"

      - name: Remove temporary Apple signing material
        if: always() && runner.os == 'macOS' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.notarize))
        run: |
          if [ -n "${MACOS_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$MACOS_KEYCHAIN_PATH" || true
          fi
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/AuthKey.p8"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [build, check-linux]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Prebuilt binaries for RavnPad ${{ github.ref_name }}.

            - **Windows:** unzip and run `ravnpad.exe`
            - **macOS:** unzip `RavnPad.app`. The app is Developer ID signed with hardened runtime, Apple-notarized, and stapled for normal Gatekeeper verification.
            - **Host and agent tools:** Windows archives include `ravnpad-host.exe`, `ravnpad-cli.exe`, and `ravnpad-mcp.exe`; macOS bundles include these under `RavnPad.app/Contents/Helpers/`.

            Apple Silicon: `ravnpad-macos-aarch64.zip`. Intel: `ravnpad-macos-x86_64.zip`.
