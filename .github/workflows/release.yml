name: Release

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
            artifact: ravnpad-windows-x86_64.zip
          - os: macos-15
            name: macos-aarch64
            artifact: ravnpad-macos-aarch64.zip
          - os: macos-15-intel
            name: macos-x86_64
            artifact: ravnpad-macos-x86_64.zip

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches crate version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$tag" != "$crate" ]; then
            echo "tag v$tag does not match Cargo.toml version $crate"
            exit 1
          fi

      - name: Test shared controller
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Test native text control
        shell: bash
        run: ./target/release/ravnpad --native-smoke-test

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/release/ravnpad.exe -DestinationPath ${{ matrix.artifact }}

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p RavnPad.app/Contents/MacOS RavnPad.app/Contents/Resources
          cp target/release/ravnpad RavnPad.app/Contents/MacOS/ravnpad
          chmod +x RavnPad.app/Contents/MacOS/ravnpad
          cp packaging/macos/Info.plist RavnPad.app/Contents/Info.plist
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" -c "Set :CFBundleVersion $version" RavnPad.app/Contents/Info.plist
          test -f target/release/ravnpad.icns
          cp target/release/ravnpad.icns RavnPad.app/Contents/Resources/RavnPad.icns
          # Sign the complete bundle after all files have been placed.
          # "-" is a free ad hoc identity, not a Developer ID certificate.
          codesign --force --sign - RavnPad.app
          codesign --verify --deep --strict --verbose=4 RavnPad.app
          ditto -c -k --sequesterRsrc --keepParent RavnPad.app "${{ matrix.artifact }}"

          # Verify the actual deliverable after a ZIP round trip.
          verify_dir="$(mktemp -d)"
          ditto -x -k "${{ matrix.artifact }}" "$verify_dir"
          codesign --verify --deep --strict --verbose=4 "$verify_dir/RavnPad.app"
          test -x "$verify_dir/RavnPad.app/Contents/MacOS/ravnpad"
          test -f "$verify_dir/RavnPad.app/Contents/Resources/RavnPad.icns"
          rm -rf "$verify_dir"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Prebuilt binaries for RavnPad ${{ github.ref_name }}.

            - **Windows:** unzip and run `ravnpad.exe`
            - **macOS:** unzip `RavnPad.app`. The app is ad hoc signed, but not Apple-notarized. Gatekeeper may block the first launch. See the [macOS installation instructions](https://github.com/robbestad/ravnpad/blob/${{ github.ref_name }}/README.md#macos) for manual approval and troubleshooting.

            Apple Silicon: `ravnpad-macos-aarch64.zip`. Intel: `ravnpad-macos-x86_64.zip`.
