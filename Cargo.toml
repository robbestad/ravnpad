[package]
name = "ravnpad"
version = "1.3.15"
default-run = "ravnpad"
edition = "2024"
rust-version = "1.88"
description = "A simple UTF-8 notepad"
license = "MIT"
readme = "README.md"
repository = "https://github.com/robbestad/ravnpad"
homepage = "https://ravnpad.com"
keywords = ["notepad", "editor", "text", "gui", "egui"]
categories = ["gui", "text-editors"]
exclude = ["website", ".env"]


[dependencies]
fs2 = "0.4"
tempfile = "3.27"
eframe = "0.33"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
spellbook = "0.4.2"
unicode-casefold = "0.2.0"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6.4"

[build-dependencies]
cc = "1"
icns = "0.3"
ico = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
winresource = "0.1"

[profile.release]
lto = true
strip = true
